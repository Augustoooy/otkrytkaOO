<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Для тебя</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marck+Script&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; -webkit-tap-highlight-color: transparent; }
  body {
    height: 100vh; height: 100dvh;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 38%, #fff0f3 0%, #ffccd5 100%);
    color: #4a1525;
    font-family: "Marck Script", "Brush Script MT", cursive;
    user-select: none; -webkit-user-select: none;
  }
  .card {
    position: relative; z-index: 2;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: clamp(6px, 2dvh, 22px);
    width: 100%; max-height: 100%;
    padding: env(safe-area-inset-top, 0px) 22px env(safe-area-inset-bottom, 0px);
    text-align: center;
    opacity: 0; transition: opacity 1s ease .3s;
  }
  .opened .card { opacity: 1; }
  .bouquet {
    height: min(40dvh, 400px); width: auto; max-width: 84vw; overflow: visible;
    transform-origin: 50% 96%;
    filter: drop-shadow(0 10px 14px rgba(122, 31, 58, .18));
  }
  .opened .bouquet { animation: sway 6s ease-in-out 2.5s infinite; }
  @keyframes sway { 0%,100% { transform: rotate(-2.2deg); } 50% { transform: rotate(2.2deg); } }
  .bl { transform-box: fill-box; transform-origin: 50% 50%; transform: scale(0); }
  .opened .bl { animation: bloom 1.3s var(--d) cubic-bezier(.34,1.56,.64,1) forwards; }
  @keyframes bloom { to { transform: scale(1); } }
  .message { max-width: 24em; font-size: clamp(1.2rem, min(5.2vw, 3.5dvh), 2.3rem); line-height: 1.3; text-wrap: balance; }
  .message p + p { margin-top: .5em; color: #8a1f45; }
  .w { display: inline-block; }
  .c { opacity: 0; transition: opacity .4s; }
  .c.on { opacity: 1; }

  /* Конверт */
  .intro {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px;
    cursor: pointer; transition: opacity 1s ease .9s, transform 1s ease .9s;
  }
  .intro.out { opacity: 0; transform: scale(.9) translateY(30px); pointer-events: none; }
  .envelope {
    position: relative; width: min(72vw, 320px); aspect-ratio: 3 / 2;
    background: #f7a9ba; border-radius: 6px;
    box-shadow: 0 18px 30px rgba(122, 31, 58, .22);
    animation: float 3.4s ease-in-out infinite;
  }
  .envelope::before {
    content: ""; position: absolute; inset: 0; border-radius: 6px; background: #ffb9c7;
    clip-path: polygon(0 0, 50% 58%, 100% 0, 100% 100%, 0 100%);
  }
  .flap {
    position: absolute; top: 0; left: 0; width: 100%; height: 58%; z-index: 2;
    background: #f58ea5; clip-path: polygon(0 0, 100% 0, 50% 100%);
    transform-origin: top; transition: transform .8s ease, opacity .4s ease .5s;
  }
  .seal {
    position: absolute; left: 50%; top: 100%; transform: translate(-50%, -100%);
    width: 40px; height: 40px; border-radius: 50%; background: #9d174d; color: #ffd6dd;
    display: grid; place-items: center; font: 22px/1 serif; font-family: system-ui, sans-serif;
  }
  .opened .flap { transform: rotateX(180deg); opacity: 0; }
  .opened .envelope { animation: none; }
  .hint { font-size: 1.6rem; animation: pulse 2.2s ease-in-out infinite; }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  @keyframes pulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }

  /* Сияние и светлячки */
  .glow {
    position: fixed; z-index: 0; left: 50%; top: 38%; width: 90vmin; height: 90vmin;
    transform: translate(-50%, -50%); pointer-events: none; opacity: 0;
    background: radial-gradient(circle, rgba(255,255,255,.8), rgba(255,255,255,0) 62%);
  }
  .opened .glow { animation: glow 5s ease-in-out 1s infinite; }
  @keyframes glow { 0%,100% { opacity: .45; } 50% { opacity: .95; } }
  .fly {
    position: fixed; z-index: 1; width: 5px; height: 5px; border-radius: 50%;
    background: #ffd166; box-shadow: 0 0 8px 3px rgba(255, 196, 90, .75);
    pointer-events: none; opacity: 0; animation: fly var(--t) ease-in-out var(--dl) infinite;
  }
  @keyframes fly {
    0% { opacity: 0; transform: translate(0,0); } 30%, 70% { opacity: .9; }
    100% { opacity: 0; transform: translate(var(--dx), var(--dy)); }
  }

  /* Лепестки, сердечки, игра */
  .petal {
    position: fixed; top: -30px; z-index: 1; pointer-events: none;
    border-radius: 150% 0 150% 0; opacity: 0; animation: fall linear forwards;
  }
  .catch {
    position: fixed; top: -60px; z-index: 4; padding: 10px; color: #e0245e;
    text-shadow: 0 2px 8px rgba(224, 36, 94, .35); cursor: pointer; touch-action: manipulation;
    opacity: 0; animation: fall linear forwards;
  }
  @keyframes fall {
    0% { opacity: 0; transform: translate3d(0,0,0) rotate(0deg); } 10% { opacity: .8; } 90% { opacity: .7; }
    100% { opacity: 0; transform: translate3d(var(--drift), 112dvh, 0) rotate(var(--spin)); }
  }
  .heart {
    position: fixed; z-index: 6; pointer-events: none; color: #d6336c; line-height: 1;
    transform: translate(-50%, -50%); animation: pop 1.3s ease-out forwards;
  }
  @keyframes pop {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(.3); }
    18% { opacity: 1; transform: translate(-50%, -80%) scale(1.15); }
    100% { opacity: 0; transform: translate(calc(-50% + var(--dx)), -280%) scale(.9); }
  }
  .score, .mute {
    position: fixed; top: calc(env(safe-area-inset-top, 0px) + 12px); z-index: 7;
    font-size: 1.5rem; line-height: 1;
  }
  .score { left: 16px; color: #c9184a; }
  .mute {
    right: 12px; width: 44px; height: 44px; border: 0; border-radius: 50%;
    background: rgba(255,255,255,.55); color: #9d174d; cursor: pointer; font-family: inherit;
  }
  .mute.off { opacity: .45; }
  .caption {
    position: fixed; left: 0; right: 0; z-index: 3; text-align: center;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 18px);
    font-size: 1.35rem; color: #8a1f45; opacity: 0; transition: opacity 1.5s;
  }
  .caption.show { opacity: 1; }
  .mute:focus-visible, .intro:focus-visible { outline: 2px solid #9d174d; outline-offset: 4px; }
  @media (prefers-reduced-motion: reduce) {
    .envelope, .hint, .opened .bouquet, .opened .glow { animation: none; }
    .bl { transform: scale(1); } .opened .bl { animation: none; }
    .petal, .fly { display: none; }
  }
</style>
</head>
<body>

<div class="glow"></div>
<div class="intro" id="intro" role="button" tabindex="0" aria-label="Открыть открытку">
  <div class="envelope"><div class="flap"><span class="seal">&#9829;</span></div></div>
  <p class="hint">Это тебе. Нажми</p>
</div>
<button class="mute" id="mute" aria-label="Музыка включена/выключена" hidden>&#9834;</button>
<div class="score" id="score" hidden>&#9829; <span id="n">0</span></div>
<p class="caption" id="cap">Все они — только для тебя &#9829;</p>

<main class="card">
  <svg class="bouquet" viewBox="0 0 320 360" role="img" aria-label="Букет из пионов, роз и тюльпанов, перевязанный лентой">
    <defs>
      <!-- Пион -->
      <g id="peony">
        <g fill="currentColor" stroke="#7a1f3a" stroke-opacity=".28" stroke-width=".9">
          <ellipse cy="-28" rx="17" ry="22"/>
          <ellipse cy="-28" rx="17" ry="22" transform="rotate(45)"/>
          <ellipse cy="-28" rx="17" ry="22" transform="rotate(90)"/>
          <ellipse cy="-28" rx="17" ry="22" transform="rotate(135)"/>
          <ellipse cy="-28" rx="17" ry="22" transform="rotate(180)"/>
          <ellipse cy="-28" rx="17" ry="22" transform="rotate(225)"/>
          <ellipse cy="-28" rx="17" ry="22" transform="rotate(270)"/>
          <ellipse cy="-28" rx="17" ry="22" transform="rotate(315)"/>
        </g>
        <g fill="currentColor" stroke="#7a1f3a" stroke-opacity=".3" stroke-width=".9" transform="rotate(22)">
          <ellipse cy="-19" rx="13" ry="17"/>
          <ellipse cy="-19" rx="13" ry="17" transform="rotate(60)"/>
          <ellipse cy="-19" rx="13" ry="17" transform="rotate(120)"/>
          <ellipse cy="-19" rx="13" ry="17" transform="rotate(180)"/>
          <ellipse cy="-19" rx="13" ry="17" transform="rotate(240)"/>
          <ellipse cy="-19" rx="13" ry="17" transform="rotate(300)"/>
        </g>
        <g fill="#fff" fill-opacity=".16" stroke="#7a1f3a" stroke-opacity=".3" stroke-width=".9">
          <ellipse cy="-10" rx="9" ry="12"/>
          <ellipse cy="-10" rx="9" ry="12" transform="rotate(72)"/>
          <ellipse cy="-10" rx="9" ry="12" transform="rotate(144)"/>
          <ellipse cy="-10" rx="9" ry="12" transform="rotate(216)"/>
          <ellipse cy="-10" rx="9" ry="12" transform="rotate(288)"/>
        </g>
        <circle r="6" fill="#7a1f3a" fill-opacity=".35"/>
        <path d="M-4 1 C-2 -6 5 -5 4 1 C3 5 -2 5 -3 2" fill="none" stroke="#7a1f3a" stroke-opacity=".5" stroke-width="1.2"/>
      </g>

      <!-- Роза -->
      <g id="rose">
        <circle r="27" fill="currentColor" stroke="#7a1f3a" stroke-opacity=".3" stroke-width="1"/>
        <path d="M-24 -10 C-14 -28 14 -28 24 -10" fill="#fff" fill-opacity=".14"/>
        <circle r="18" fill="currentColor" stroke="#7a1f3a" stroke-opacity=".35" stroke-width="1"/>
        <path d="M-17 4 C-14 -16 14 -16 17 4 C10 14 -10 14 -17 4Z" fill="#fff" fill-opacity=".12"/>
        <circle r="10" fill="currentColor" stroke="#7a1f3a" stroke-opacity=".4" stroke-width="1"/>
        <path d="M-7 3 C-8 -8 8 -9 7 1 C6 8 -3 8 -3 2 C-3 -3 3 -3 3 0" fill="none" stroke="#7a1f3a" stroke-opacity=".55" stroke-width="1.3" stroke-linecap="round"/>
        <path d="M-26 6 C-20 22 20 22 26 6" fill="none" stroke="#7a1f3a" stroke-opacity=".25" stroke-width="1.2"/>
      </g>

      <!-- Тюльпан -->
      <g id="tulip">
        <path d="M-15 0 C-19 -26 -9 -42 0 -50 C9 -42 19 -26 15 0 C8 8 -8 8 -15 0Z" fill="currentColor" stroke="#7a1f3a" stroke-opacity=".3" stroke-width="1"/>
        <path d="M-15 0 C-18 -22 -9 -36 -3 -44 C-1 -28 -2 -12 0 6 C-8 7 -12 4 -15 0Z" fill="#fff" fill-opacity=".14"/>
        <path d="M15 0 C18 -22 9 -36 3 -44 C1 -28 2 -12 0 6 C8 7 12 4 15 0Z" fill="#000" fill-opacity=".08"/>
      </g>

      <!-- Лист -->
      <path id="leaf" d="M0 0 C14 -16 14 -44 0 -64 C-14 -44 -14 -16 0 0Z" fill="#5f9d6a" stroke="#2f6a43" stroke-opacity=".5" stroke-width="1"/>
    </defs>

    <!-- Стебли -->
    <g fill="none" stroke="#3f8052" stroke-width="4.5" stroke-linecap="round">
      <path d="M160 262 C160 200 160 150 160 108"/>
      <path d="M160 262 C150 215 120 170 98 140"/>
      <path d="M160 262 C172 215 205 170 226 134"/>
      <path d="M160 262 C140 230 100 215 62 196"/>
      <path d="M160 262 C182 232 222 212 262 190"/>
      <path d="M160 262 C150 200 118 140 112 86" stroke-width="4"/>
      <path d="M160 262 C174 200 206 140 214 80" stroke-width="4"/>
    </g>

    <!-- Листья -->
    <use href="#leaf" transform="translate(150 220) rotate(-62) scale(.85)"/>
    <use href="#leaf" transform="translate(172 214) rotate(60) scale(.85)"/>
    <use href="#leaf" transform="translate(130 196) rotate(-100) scale(.7)"/>
    <use href="#leaf" transform="translate(192 192) rotate(100) scale(.7)"/>
    <use href="#leaf" transform="translate(158 176) rotate(-28) scale(.6)"/>
    <use href="#leaf" transform="translate(163 176) rotate(30) scale(.6)"/>

    <!-- Тюльпаны -->
    <g class="bl" style="--d:1.1s"><use href="#tulip" transform="translate(112 90) rotate(-12) scale(.95)" style="color:#f6a5b5"/></g>
    <g class="bl" style="--d:1.3s"><use href="#tulip" transform="translate(214 84) rotate(12) scale(.95)" style="color:#ff8fa3"/></g>

    <!-- Розы -->
    <g class="bl" style="--d:.8s"><use href="#rose" transform="translate(62 192) scale(1.05)" style="color:#c9184a"/></g>
    <g class="bl" style="--d:1s"><use href="#rose" transform="translate(262 186) scale(1.05)" style="color:#e5395f"/></g>
    <g class="bl" style="--d:1.2s"><use href="#rose" transform="translate(226 140) scale(.95)" style="color:#ff758f"/></g>

    <!-- Пионы -->
    <g class="bl" style="--d:.5s"><use href="#peony" transform="translate(98 142) scale(1)" style="color:#ffb3c1"/></g>
    <g class="bl" style="--d:.2s"><use href="#peony" transform="translate(160 104) scale(1.3)" style="color:#ff8fa3"/></g>

    <!-- Обёртка -->
    <path d="M96 238 C120 250 200 250 224 238 L176 352 L144 352Z" fill="#fff7f0" stroke="#d9a7a0" stroke-width="1.2"/>
    <path d="M122 246 L150 350 M198 246 L170 350" stroke="#e8c6c0" stroke-width="1.2" fill="none"/>

    <!-- Лента с бантом -->
    <path d="M118 262 C140 272 180 272 202 262 L200 276 C180 286 140 286 120 276Z" fill="#9d174d" stroke="#6b0f33" stroke-opacity=".4" stroke-width="1"/>
    <path d="M160 272 C136 256 108 262 112 288 C116 300 146 288 160 276Z" fill="#be185d" stroke="#6b0f33" stroke-opacity=".4" stroke-width="1"/>
    <path d="M160 272 C184 256 212 262 208 288 C204 300 174 288 160 276Z" fill="#be185d" stroke="#6b0f33" stroke-opacity=".4" stroke-width="1"/>
    <path d="M156 278 C148 300 140 320 128 338 L142 334 L152 346 C156 326 162 304 164 280Z" fill="#9d174d" stroke="#6b0f33" stroke-opacity=".4" stroke-width="1"/>
    <path d="M164 278 C172 300 180 320 192 338 L178 334 L168 346 C164 326 158 304 156 280Z" fill="#9d174d" stroke="#6b0f33" stroke-opacity=".4" stroke-width="1"/>
    <ellipse cx="160" cy="276" rx="9" ry="8" fill="#831843"/>
  </svg>

  <div class="message" id="msg">
    <p>Котёнок, я тебя очень сильно люблю. Прости, если что-то делаю не так. Спасибо тебе за всё</p>
    <p>Ты — моё самое тёплое место на свете.</p>
  </div>
</main>

<script>
(function () {
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var $ = function (id) { return document.getElementById(id); };
  var rand = function (a, b) { return a + Math.random() * (b - a); };
  var colors = ['#ffb3c1', '#ff8fa3', '#ff758f', '#f8c8d0', '#ffd6dd'];
  var opened = false, caught = 0;

  function add(el, life) { document.body.appendChild(el); el.addEventListener('animationend', function () { el.remove(); }); }

  function tapHeart(x, y, size) {
    var h = document.createElement('span');
    h.className = 'heart'; h.textContent = '\u2665';
    h.style.left = x + 'px'; h.style.top = y + 'px';
    h.style.fontSize = (size || rand(20, 34)) + 'px';
    h.style.setProperty('--dx', rand(-30, 30) + 'px');
    add(h);
  }
  document.addEventListener('pointerdown', function (e) { tapHeart(e.clientX, e.clientY); });

  function petal() {
    if (document.hidden) return;
    var p = document.createElement('div'), size = rand(9, 18);
    p.className = 'petal'; p.style.left = rand(0, 100) + 'vw';
    p.style.width = size + 'px'; p.style.height = size * 1.25 + 'px';
    p.style.background = colors[(Math.random() * colors.length) | 0];
    p.style.setProperty('--drift', rand(-90, 90) + 'px');
    p.style.setProperty('--spin', rand(240, 720) + 'deg');
    p.style.animationDuration = rand(9, 16) + 's';
    add(p);
  }

  function fireflies() {
    for (var i = 0; i < 16; i++) {
      var f = document.createElement('div');
      f.className = 'fly';
      f.style.left = rand(4, 96) + 'vw'; f.style.top = rand(10, 90) + 'vh';
      f.style.setProperty('--dx', rand(-60, 60) + 'px');
      f.style.setProperty('--dy', rand(-80, 40) + 'px');
      f.style.setProperty('--t', rand(6, 12) + 's');
      f.style.setProperty('--dl', rand(0, 6) + 's');
      document.body.appendChild(f);
    }
  }

  /* Текст по буквам */
  var msg = $('msg');
  Array.prototype.forEach.call(msg.querySelectorAll('p'), function (p) {
    var words = p.textContent.split(' ');
    p.textContent = '';
    words.forEach(function (w, i) {
      var ws = document.createElement('span'); ws.className = 'w';
      w.split('').forEach(function (ch) {
        var c = document.createElement('span'); c.className = 'c'; c.textContent = ch; ws.appendChild(c);
      });
      p.appendChild(ws);
      if (i < words.length - 1) p.appendChild(document.createTextNode(' '));
    });
  });
  var chars = msg.querySelectorAll('.c'), ci = 0;
  function type() {
    if (ci >= chars.length) { setTimeout(startGame, 1200); return; }
    var c = chars[ci++]; c.className = 'c on';
    setTimeout(type, /[.,]/.test(c.textContent) ? 380 : reduce ? 0 : 48);
  }

  /* Игра: ловить сердечки */
  function startGame() {
    $('score').hidden = false;
    setInterval(function () {
      if (document.hidden || document.querySelectorAll('.catch').length >= 3) return;
      var h = document.createElement('span');
      h.className = 'catch'; h.textContent = '\u2665';
      h.style.left = rand(8, 90) + 'vw'; h.style.fontSize = rand(30, 42) + 'px';
      h.style.setProperty('--drift', rand(-40, 40) + 'px');
      h.style.setProperty('--spin', rand(-30, 30) + 'deg');
      h.style.animationDuration = rand(6, 9) + 's';
      h.addEventListener('pointerdown', function (e) {
        e.stopPropagation();
        for (var i = 0; i < 4; i++) tapHeart(e.clientX + rand(-14, 14), e.clientY + rand(-14, 14), rand(14, 24));
        h.remove(); caught++; $('n').textContent = caught;
        if (caught === 10) $('cap').classList.add('show');
      });
      add(h);
    }, 1500);
  }

  /* Музыка (синтез, без файлов) */
  var ac, master, step = 0, nextT = 0, on = false;
  var prog = [[57, 60, 64], [53, 57, 60], [48, 52, 55], [55, 59, 62]];
  var pat = [0, 1, 2, 1, 2, 1, 2, 1];
  function note(m, t, dur, vol, type) {
    var o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = 440 * Math.pow(2, (m - 69) / 12);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .03);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + .05);
  }
  function sched() {
    while (nextT < ac.currentTime + .4) {
      var ch = prog[Math.floor(step / 8) % 4], k = step % 8;
      if (k === 0) { note(ch[0] - 12, nextT, 3.6, .12, 'sine'); note(ch[1], nextT, 3.6, .03, 'sine'); note(ch[2], nextT, 3.6, .03, 'sine'); }
      note(ch[pat[k]] + 12, nextT, 1.8, .07, 'triangle');
      step++; nextT += .5;
    }
  }
  function music() {
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      ac = new AC(); master = ac.createGain(); master.gain.value = .55;
      var f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 1900;
      master.connect(f); f.connect(ac.destination);
      if (ac.state === 'suspended') ac.resume();
      nextT = ac.currentTime + .1; setInterval(sched, 100); on = true;
      $('mute').hidden = false;
    } catch (e) {}
  }
  $('mute').addEventListener('click', function (e) {
    e.stopPropagation();
    if (!ac) return;
    on = !on; on ? ac.resume() : ac.suspend();
    this.classList.toggle('off', !on);
  });

  /* Открытие */
  function open() {
    if (opened) return; opened = true;
    document.body.classList.add('opened');
    $('intro').classList.add('out');
    setTimeout(function () { $('intro').remove(); }, 2200);
    music();
    if (!reduce) { fireflies(); for (var i = 0; i < 5; i++) setTimeout(petal, i * 500); setInterval(petal, 1100); }
    setTimeout(type, reduce ? 0 : 2200);
  }
  $('intro').addEventListener('click', open);
  $('intro').addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') open(); });
})();
</script>
</body>
</html>
